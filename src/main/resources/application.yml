server:
  port: 8080
  servlet:
    context-path: /bookkeeping-server

spring:
  application:
    name: bookkeeping-server

  # Druid连接池配置（高并发优化）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bookkeeping?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    druid:
      # 连接池初始化配置
      initial-size: 10
      min-idle: 10
      max-active: 100
      max-wait: 60000
      # 连接检测配置
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      validation-query: SELECT 1
      validation-query-timeout: 1
      # 连接保持活动配置
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      # 连接泄漏检测
      remove-abandoned: true
      remove-abandoned-timeout: 180
      log-abandoned: true
      # 监控配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      # 过滤器配置
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

  # 异步线程池配置（用于异步日志）
  task:
    execution:
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 200
        keep-alive: 60s
        allow-core-thread-timeout: true
      thread-name-prefix: async-log-

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.bookkeeping.entity

# 微信小程序配置
wx:
  miniapp:
    app-id: your-app-id
    app-secret: your-app-secret

# 微信订阅消息配置
wechat:
  app-id: your-app-id
  app-secret: your-app-secret
  template-id: your-subscribe-template-id

# JWT配置
jwt:
  secret: your-secret-key-here-must-be-at-least-256-bits-long-for-security
  expiration: 86400000  # 24小时，单位毫秒

# 管理员配置
admin:
  username: admin
  password: admin123

# 日志配置
logging:
  level:
    com.bookkeeping: debug
    org.springframework.security: debug
